# Netlify config for Dink Club.
# Static site (no build step) + serverless functions for the Marketing Studio AI.
[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Pin Node so the functions runtime (and @netlify/blobs) stays predictable.
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Renew the Instagram token every Monday 09:00 UTC so it never expires.
# Logic lives in netlify/functions/ig-refresh.js.
[functions."ig-refresh"]
  schedule = "0 9 * * 1"

# Long-cache static images (they rarely change); HTML/CSS/JS left uncached to avoid stale previews.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Baseline security headers on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# --- Launch redirects (clean URLs at www.dinkclub.com) ---
# Netlify serves clean URLs (/about from about.html) automatically. These 301s
# preserve SEO from the old Shopify URL structure and retired paths.
# Order matters: specific rules before wildcards (first match wins).

# The old "Play" hub page no longer exists -> send to the court-reservations hub.
[[redirects]]
  from = "/pages/play"
  to = "/court-reservations"
  status = 301
[[redirects]]
  from = "/play"
  to = "/court-reservations"
  status = 301

# Shopify pages whose SLUG CHANGED in the migration. These must sit ABOVE the
# /pages/* wildcard below, because first match wins — the wildcard maps
# /pages/about-us to /about-us, which does not exist, so all three of these were
# returning 404 while still ranking in Google. /pages/about-us was sitting at
# position 2.6 and taking real traffic straight into a dead page.
[[redirects]]
  from = "/pages/about-us"
  to = "/about"
  status = 301
# Retired: there is no membership page — the club is pay-as-you-play. Sending to
# the booking + pricing hub, which is the closest live intent.
[[redirects]]
  from = "/pages/membership"
  to = "/court-reservations"
  status = 301
# Retired one-off event stream -> the tournaments hub.
[[redirects]]
  from = "/pages/dink-palooza-live-stream"
  to = "/tournaments"
  status = 301

# Old Shopify /pages/<x> content URLs -> clean /<x>.
[[redirects]]
  from = "/pages/*"
  to = "/:splat"
  status = 301

# Old Shopify store URLs (shop is paused) -> the "coming soon" shop page.
[[redirects]]
  from = "/products/*"
  to = "/shop"
  status = 301
[[redirects]]
  from = "/collections/*"
  to = "/shop"
  status = 301
[[redirects]]
  from = "/cart"
  to = "/shop"
  status = 301
