# Netlify config for Dink Club.
# Static site (no build step) + serverless functions for the Marketing Studio AI.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Long-cache static images (they rarely change); HTML/CSS/JS left uncached to avoid stale previews.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Baseline security headers on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# --- Launch redirects (clean URLs at www.dinkclub.com) ---
# Netlify serves clean URLs (/about from about.html) automatically. These 301s
# preserve SEO from the old Shopify URL structure and retired paths.
# Order matters: specific rules before wildcards (first match wins).

# The old "Play" hub page no longer exists -> send to the court-reservations hub.
[[redirects]]
  from = "/pages/play"
  to = "/court-reservations"
  status = 301
[[redirects]]
  from = "/play"
  to = "/court-reservations"
  status = 301

# Old Shopify /pages/<x> content URLs -> clean /<x>.
[[redirects]]
  from = "/pages/*"
  to = "/:splat"
  status = 301

# Old Shopify store URLs (shop is paused) -> the "coming soon" shop page.
[[redirects]]
  from = "/products/*"
  to = "/shop"
  status = 301
[[redirects]]
  from = "/collections/*"
  to = "/shop"
  status = 301
[[redirects]]
  from = "/cart"
  to = "/shop"
  status = 301
